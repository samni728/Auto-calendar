[project]
name = "auto-calendar-api"
version = "0.1.0"
description = "Self-hosted hotel calendar synchronization API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<46",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "B008", # FastAPI injection intentionally uses Depends/Query defaults.
  "BLE001", # Background sync must isolate any provider/network failure.
  "DTZ011", # Hotel timeline stores local calendar dates, not instants.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
